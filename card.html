<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bryllupsinvitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: white;
      font-family: 'Playfair Display', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card-container {
      perspective: 1000px;
    }

    .card {
      width: 350px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border: 0px solid black;
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
      background-size: cover;
      background-position: center;
    }

    .front {
      background-image: url('front.jpg'); /* Replace with your front image */
    }

    .back {
      background-image: url('back.jpg'); /* Replace with your back image */
      transform: rotateY(180deg);
    }
	#front{
	  max-width: inherit;
  max-height: inherit;
  height: inherit;
  width: inherit;
  object-fit: cover;
	}
	#back{
	  max-width: inherit;
  max-height: inherit;
  height: inherit;
  width: inherit;
  object-fit: cover;
	}
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card" id="flipCard">
      <div class="card-face front"><img id="front" src="frontside.png"/></div>
      <a class="card-face back" href="index.html"><img id="back" src="backside.png"/></a>
    </div>
  </div>

  <script>
    const card = document.getElementById('flipCard');
    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  </script>

</body>
</html>
